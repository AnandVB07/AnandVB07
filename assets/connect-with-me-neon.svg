<text x="166" y="328">Portfolio</text><text x="386" y="328">LinkedIn</text><text x="606" y="328">WhatsApp</text><text x="826" y="328">Resume Folder</text>
</g>
<path d="M68 381H927" stroke="#185E93" stroke-width="1.4"/>
<circle cx="78" cy="399" r="5" fill="#13DAF9"/>
<text x="96" y="406" font-size="19" font-family="Arial,Helvetica,sans-serif" fill="#B7CDE6" letter-spacing="2">Code. Create. Build. </text>
<text x="319" y="406" font-size="19" font-family="Arial,Helvetica,sans-serif" fill="#05D0FB" letter-spacing="2" font-weight="700">Repeat.</text>
