<path d="M1046 226l193 32-21 132-192-32z" fill="#0A234C" stroke="#2389EF" stroke-width="5"/>
<path d="M1058 240l167 28-17 111-167-28z" fill="url(#screen)" stroke="#30C6FF" stroke-width="1.6"/>
<path d="M1091 295l-19 16 18 19m81-21 20 18-26 10" fill="none" stroke="#30D8FF" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M1023 361l197 30 45 22-206-17z" fill="#0D427D" stroke="#2996F0" stroke-width="2"/>
<path d="M1055 379l150 22" stroke="#247FCB" stroke-width="8" stroke-dasharray="17 6"/>
<path d="M1042 360l189 32" stroke="#3CD9FF" stroke-opacity=".4" stroke-width="3" filter="url(#blur)"/>
<!-- orbit / social nodes -->
<path d="M1017 215q112-139 278-70" fill="none" stroke="#0B75D9" stroke-width="1.4" opacity=".45"/>
<path d="M1000 365q173 77 312-35" fill="none" stroke="#0B75D9" stroke-width="1.3" opacity=".65"/>
</g>
<!-- heading glass link icon -->
<rect x="66" y="72" width="78" height="77" rx="20" fill="url(#glow)" stroke="#21AFFF" stroke-width="2"/>
<g transform="translate(88,92)" fill="none" stroke="#17D8FF" stroke-width="6" stroke-linecap="round">
<path d="M18 24l20-20q12-9 20 1t-1 19L43 37m-3-14L22 41q-12 9-20-1t1-19L17 7"/>
</g>
<text x="166" y="126" fill="#F8FBFF" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800">Connect</text>
<text x="357" y="126" fill="#09D0F9" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800">With Me</text>
<text x="169" y="156" fill="#97B2D1" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" letter-spacing="4">LINKS  |  NETWORKING  |  LET'S CONNECT</text>
