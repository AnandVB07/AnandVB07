<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="460" viewBox="0 0 1360 460" role="img" aria-labelledby="title desc">
<title id="title">Connect With Me - Anand VB</title>
<desc id="desc">Elegant neon-blue connect panel featuring Portfolio, LinkedIn, WhatsApp and Resume Folder cards, with a glowing laptop and global network illustration.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030E1E"/><stop offset=".5" stop-color="#081D35"/><stop offset="1" stop-color="#051D42"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#01D6FC"/><stop offset="1" stop-color="#187DFF"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#042B57"/><stop offset="1" stop-color="#060D23"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#124F96"/><stop offset=".6" stop-color="#071D45"/><stop offset="1" stop-color="#02102F"/></linearGradient>
<radialGradient id="planet" cx=".29" cy=".23" r=".85"><stop stop-color="#2386E9" stop-opacity=".8"/><stop offset=".5" stop-color="#07509F"/><stop offset="1" stop-color="#091745"/></radialGradient>
<radialGradient id="fog"><stop stop-color="#0E87F0" stop-opacity=".4"/><stop offset="1" stop-color="#0E87F0" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="11"/></filter>
<clipPath id="clip"><rect x="22" y="26" width="1316" height="408" rx="24"/></clipPath>
</defs>
<rect width="1360" height="460" fill="#030A16"/>
<rect x="22" y="26" width="1316" height="408" rx="24" fill="url(#bg)" stroke="url(#edge)" stroke-width="1.9"/>
<g clip-path="url(#clip)">
<!-- understated small stars -->
<g fill="#38CBFF" opacity=".8"><circle cx="1083" cy="74" r="1.7"/><circle cx="1252" cy="98" r="1.6"/><circle cx="1124" cy="173" r="1.8"/><circle cx="1304" cy="291" r="1.3"/></g>
<circle cx="1174" cy="247" r="165" fill="url(#fog)"/>
<!-- Globe -->
<circle cx="1195" cy="192" r="81" fill="url(#planet)" stroke="#1B8FFF" stroke-width="1.8"/>
<ellipse cx="1195" cy="192" rx="34" ry="81" fill="none" stroke="#249FF5" stroke-opacity=".5" stroke-width="1.3"/>
<ellipse cx="1195" cy="192" rx="81" ry="27" fill="none" stroke="#1C98F6" stroke-opacity=".6" stroke-width="1.4"/>
<circle cx="1218" cy="151" r="3.5" fill="#63E6FF"/><circle cx="1144" cy="204" r="3.5" fill="#63E6FF"/>
<path d="M1144 204l74-53 49 66" fill="none" stroke="#18A5F7" stroke-width="1.4" stroke-opacity=".8"/>
