<rect x="345" y="208" width="85" height="83" rx="18" fill="#075EA5" stroke="#0DB8FF" stroke-width="1.5"/>
<text x="365" y="273" fill="#F7FFFF" font-size="61" font-weight="800" font-family="Arial,Helvetica,sans-serif">in</text>
