<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Anand VB developer arcade</title>
<desc id="desc">A playful neon scene with Anand VB's name, a three dimensional laptop, floating code stickers, and an orange smiling cube.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11172F"/><stop offset=".53" stop-color="#151332"/><stop offset="1" stop-color="#0D2635"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#6856E9" stop-opacity=".50"/><stop offset="1" stop-color="#6856E9" stop-opacity="0"/></radialGradient>
  <radialGradient id="aura2"><stop stop-color="#18DCC7" stop-opacity=".27"/><stop offset="1" stop-color="#18DCC7" stop-opacity="0"/></radialGradient>
  <linearGradient id="headline"><stop stop-color="#F5F2FF"/><stop offset=".58" stop-color="#F7D3FE"/><stop offset="1" stop-color="#8EEAF1"/></linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A99AFF"/><stop offset=".5" stop-color="#4B4F92"/><stop offset="1" stop-color="#22234F"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#252C5B"/><stop offset="1" stop-color="#12172D"/></linearGradient>
  <linearGradient id="keyboard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B1A8F8"/><stop offset=".7" stop-color="#656AA6"/><stop offset="1" stop-color="#373D77"/></linearGradient>
  <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE7A0"/><stop offset=".55" stop-color="#FFB558"/><stop offset="1" stop-color="#FD6374"/></linearGradient>
  <linearGradient id="cubeL"><stop stop-color="#FFAC7A"/><stop offset="1" stop-color="#F46C7B"/></linearGradient>
  <linearGradient id="cubeR"><stop stop-color="#E54D74"/><stop offset="1" stop-color="#9D3F93"/></linearGradient>
  <linearGradient id="cubeT"><stop stop-color="#FFE0A0"/><stop offset="1" stop-color="#FFAC77"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
  <pattern id="dots" width="29" height="29" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#BFC9FF" opacity=".16"/></pattern>
  <clipPath id="clip"><rect x="0" y="0" width="1200" height="480" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="480" fill="url(#bg)"/>
<rect width="1200" height="480" fill="url(#dots)"/>
<circle cx="895" cy="228" r="330" fill="url(#aura)"/>
<circle cx="1044" cy="340" r="260" fill="url(#aura2)"/>
<path d="M0 420 Q380 365 585 465L1200 465" fill="none" stroke="#565A91" stroke-opacity=".20" stroke-width="2"/>
<path d="M620 40l7 0m-3.5-3.5v7 M1120 370h13m-6.5-6.5v13 M680 90h13m-6.5-6.5v13 M1072 55h10m-5-5v10" stroke="#B7FCF1" stroke-width="2" stroke-linecap="round" opacity=".75"/>
<circle cx="617" cy="345" r="3" fill="#FCB979"/><circle cx="1154" cy="178" r="4" fill="#6AF7E8"/><circle cx="1155" cy="401" r="3" fill="#D6A5FF"/>
<!-- left editorial copy -->
<rect x="62" y="49" width="280" height="32" rx="16" fill="#252A51" stroke="#6C6DA2" stroke-opacity=".6"/>
<circle cx="80" cy="65" r="5" fill="#4EF1C3"/>
<text x="93" y="70" fill="#C9C9F4" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="2">PLAYER 01  /  DEV MODE ON</text>
<text x="62" y="161" fill="#FEF7FF" font-size="57" font-family="Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="-2">HEY, I'M</text>
<text x="59" y="244" fill="url(#headline)" font-size="82" font-family="Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="-4">ANAND VB.</text>
<rect x="63" y="263" width="310" height="5" rx="3" fill="#42E0CA"/>
<text x="63" y="306" fill="#DFDDF7" font-size="21" font-family="Arial, Helvetica, sans-serif" font-weight="600">I make apps. They make bugs.</text>
<text x="63" y="333" fill="#B5B8D9" font-size="18" font-family="Arial, Helvetica, sans-serif">We work things out eventually.</text>
<rect x="63" y="368" width="91" height="34" rx="17" fill="#272F59" stroke="#5F6999"/><text x="108" y="390" text-anchor="middle" fill="#E0ECFF" font-size="13" font-family="Arial" font-weight="700">☕ JAVA</text>
<rect x="164" y="368" width="99" height="34" rx="17" fill="#263F53" stroke="#368F9E"/><text x="213" y="390" text-anchor="middle" fill="#BFFCF6" font-size="13" font-family="Arial" font-weight="700">REACT</text>
<rect x="273" y="368" width="106" height="34" rx="17" fill="#482F58" stroke="#A35D9E"/><text x="326" y="390" text-anchor="middle" fill="#FFE0F6" font-size="13" font-family="Arial" font-weight="700">AI / ML</text>
<text x="63" y="443" fill="#888FB6" font-size="12" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">NO SLEEP MODE  ·  ONLY BUILD MODE</text>
<!-- right isometric stage -->
<ellipse cx="939" cy="381" rx="244" ry="36" fill="#07091B" opacity=".6" filter="url(#shadow)"/>
<path d="M670 362L938 304L1171 359L895 432Z" fill="#24335D" stroke="#475A8A" stroke-width="2"/>
<path d="M670 362L895 432L895 443L670 371Z" fill="#171D43"/>
<path d="M895 432L1171 359L1171 370L895 443Z" fill="#182D48"/>
<path d="M700 360L939 315L1136 361L891 416Z" fill="none" stroke="#47C8D3" stroke-opacity=".24" stroke-width="2"/>
<!-- terminal laptop shadow -->
<path d="M766 155L1023 111L1098 258L836 308Z" fill="#090D20" opacity=".42" filter="url(#shadow)"/>
<!-- monitor bezel -->
<path d="M756 130L1018 90Q1031 88 1037 100L1108 242Q1113 252 1102 255L839 307Q829 309 824 296L746 150Q739 137 756 130Z" fill="url(#rim)" stroke="#C2AEFF" stroke-width="3"/>
<path d="M773 146L1012 107L1088 240L842 289Z" fill="url(#screen)" stroke="#111B40" stroke-width="4"/>
<!-- terminal panel is shaped to match tilted screen -->
<path d="M788 164L1001 129L1059 233L849 273Z" fill="#101F36" stroke="#61D7D4" stroke-opacity=".45" stroke-width="1.5"/>
<path d="M788 164L1001 129L1009 144L797 178Z" fill="#223D54"/>
<circle cx="802" cy="165" r="3.2" fill="#FF7B7B"/><circle cx="812" cy="163" r="3.2" fill="#F8D078"/><circle cx="822" cy="162" r="3.2" fill="#66E7B8"/>
<g font-family="monospace" font-weight="700">
<text x="837" y="187" fill="#6BF1D4" font-size="19" transform="rotate(-8 837 187)">&gt; hello_world()</text>
<text x="851" y="214" fill="#E6DEF8" font-size="17" transform="rotate(-8 851 214)">building cool stuff</text>
<text x="863" y="240" fill="#F3AFD4" font-size="17" transform="rotate(-8 863 240)">while(true) { code(); }</text>
</g>
<!-- laptop base -->
<path d="M837 305L1105 253L1170 301L890 364Z" fill="url(#keyboard)" stroke="#C9D2FF" stroke-width="2.4"/>
<path d="M854 315L1104 268L1134 291L881 340Z" fill="#374574" stroke="#7186B3" stroke-width="1.5"/>
<path d="M897 327L1101 289" stroke="#92A7D6" stroke-width="5" stroke-dasharray="14 7" opacity=".7"/>
<path d="M881 340L1134 291" stroke="#9CB0DB" stroke-width="2" opacity=".65"/>
<path d="M890 364L1170 301L1168 317L890 382Z" fill="#3D3C76"/>
<path d="M837 305L890 364L890 382L837 321Z" fill="#4B4488"/>
<!-- character cube shadow -->
<ellipse cx="711" cy="376" rx="65" ry="17" fill="#070A20" opacity=".55" filter="url(#shadow)"/>
<path d="M654 302L706 274L764 296L709 331Z" fill="url(#cubeT)" stroke="#FFEACD" stroke-width="2"/>
<path d="M654 302L709 331L709 395L654 365Z" fill="url(#cubeL)" stroke="#FFC4B8" stroke-width="2"/>
<path d="M709 331L764 296L764 362L709 395Z" fill="url(#cubeR)" stroke="#FFACB3" stroke-width="2"/>
<ellipse cx="729" cy="339" rx="3.8" ry="5.3" fill="#291B50"/><ellipse cx="749" cy="327" rx="3.8" ry="5.3" fill="#291B50"/>
<path d="M728 356Q741 367 751 346" fill="none" stroke="#291B50" stroke-width="3.5" stroke-linecap="round"/>
<path d="M675 325L675 341M664 334L685 333" stroke="#FFE1C7" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
<!-- floating coin -->
<ellipse cx="1094" cy="102" rx="30" ry="34" fill="#FA7180" opacity=".32" filter="url(#glow)"/>
<circle cx="1090" cy="92" r="33" fill="#C75A88" stroke="#FDC0A7" stroke-width="2"/>
<circle cx="1085" cy="87" r="31" fill="url(#coin)" stroke="#FFE8B3" stroke-width="3"/>
<circle cx="1085" cy="87" r="22" fill="none" stroke="#CE6D64" stroke-width="2" stroke-opacity=".5"/>
<text x="1085" y="99" fill="#8A3968" font-size="33" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900">{ }</text>
<!-- float chip -->
<g transform="rotate(-12 723 102)">
<rect x="660" y="91" width="129" height="44" rx="15" fill="#313A70" stroke="#A5A8FC" stroke-width="2"/>
<rect x="663" y="94" width="122" height="36" rx="12" fill="#34396A"/>
<text x="724" y="119" font-family="Arial" font-size="17" font-weight="900" text-anchor="middle" fill="#E6E2FF">404 sleep</text>
</g>
<!-- float little symbols -->
<path d="M1161 213l9 17 19 3-14 12 3 19-17-9-16 9 3-19-14-12 19-3Z" fill="#F8B86D" opacity=".94"/>
<path d="M626 197l15 0m-7.5-7.5v15" stroke="#D5B9FF" stroke-width="4" stroke-linecap="round"/>
<path d="M1054 374l13 0m-6.5-6.5v13" stroke="#76ECDD" stroke-width="3" stroke-linecap="round"/>
<rect x="1" y="1" width="1198" height="478" rx="23" fill="none" stroke="#BAC4FF" stroke-opacity=".18" stroke-width="2"/>
</g>
</svg>