<rect x="565" y="208" width="85" height="83" rx="18" fill="#043F39" stroke="#20E4B1" stroke-width="1.5"/>
<path d="M587 274l6-13q-10-13 1-27t27-8q14 8 11 24t-18 18q-8 0-14-4z" fill="none" stroke="#60F5C1" stroke-width="5" stroke-linejoin="round"/>
