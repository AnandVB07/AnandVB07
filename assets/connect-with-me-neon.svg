<rect x="125" y="208" width="85" height="83" rx="18" fill="#062B5D" stroke="#0EBDFC" stroke-width="1.5"/>
<rect x="146" y="226" width="44" height="38" rx="4" fill="none" stroke="#10CFFF" stroke-width="5"/>
<path d="M146 234h44M154 241h3m8 0h3m-13 11h22" stroke="#10CFFF" stroke-width="3" stroke-linecap="round"/>
