<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
<title id="title">Contribution Quest — an animated dragon collecting contribution crystals</title>
<desc id="desc">A dragon gathers glowing green crystals beside a GitHub-style contribution grid.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071422"/><stop offset="1" stop-color="#0d1c31"/></linearGradient>
  <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#0f2338"/><stop offset="1" stop-color="#0a1728"/></linearGradient>
  <linearGradient id="dragon" x2="1" y2="1"><stop stop-color="#75f0b0"/><stop offset=".48" stop-color="#1eae81"/><stop offset="1" stop-color="#08775f"/></linearGradient>
  <linearGradient id="wing" x2="1" y2="1"><stop stop-color="#50dca2" stop-opacity=".92"/><stop offset="1" stop-color="#126d6d" stop-opacity=".92"/></linearGradient>
  <linearGradient id="crystal" x2="1" y2="1"><stop stop-color="#d6ffe8"/><stop offset=".45" stop-color="#3be38f"/><stop offset="1" stop-color="#0ba76d"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
