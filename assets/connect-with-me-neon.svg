<rect x="288" y="191" width="196" height="162" rx="18" fill="#06192E" stroke="#1A5C8D" stroke-width="1.7"/>
<rect x="508" y="191" width="196" height="162" rx="18" fill="#06192E" stroke="#2A579E" stroke-width="1.7"/>
<rect x="728" y="191" width="196" height="162" rx="18" fill="#06192E" stroke="#755091" stroke-width="1.7"/>
