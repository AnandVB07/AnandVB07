name: Refresh GitHub profile widgets

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled runs can be delayed. Rebuild four times per day.
    - cron: "17 0,6,12,18 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/generate_analytics.py"
      - "scripts/generate_profile_panels.py"
      - ".github/workflows/update-profile-analytics.yml"

permissions:
  contents: write

concurrency:
  group: profile-analytics-refresh
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch real GitHub stats and render SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_analytics.py
          python scripts/generate_profile_panels.py
      - name: Commit dashboard only when it changes
        run: |
          if [ -n "$(git status --porcelain -- assets/github-analytics-live.svg assets/profile-panels-live.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/github-analytics-live.svg assets/profile-panels-live.svg
            git commit -m "chore(profile): refresh live analytics dashboard [skip ci]"
            git push
          else
            echo "Dashboard already up to date"
          fi
